<body>
<header>
  <h1>🌌 記帳背景・六種設計</h1>
  <p>左邊是 App 實際畫面（雪球是真的 3D，可以拖著轉、點一下搖），右邊點一下換背景。前兩個是你給的圖，後四個是我做的（純程式畫、不用圖片，很輕）。</p>
</header>
<main>
  <div class="phone"><div class="screen" id="screen"></div></div>
  <aside><div class="card" style="padding:20px 22px">
    <h2 style="margin:0 0 12px;font-size:19px">選背景</h2>
    <div id="bgPick"></div>
    <div class="driftRow"><span>背景慢慢飄（圖片的那兩個）</span><button class="tog on" id="drift"></button></div>
    <div id="bgNote"></div>
    <h3 style="margin:18px 0 6px;font-size:14.5px">放進 App 的做法</h3>
    <ul style="margin:0;padding-left:18px;color:var(--ink2);font-size:14px;line-height:1.7">
      <li>圖片背景轉成 JPG（每張約 80–100 KB），打包在 App 裡，離線也有。</li>
      <li>「慢慢飄」是很慢的位移（約 40 秒一輪），不影響閱讀。</li>
      <li>會動的極光、雪夜、暖金散景都是程式畫的，不用下載圖片。</li>
      <li>要的話也可以做成設定讓你自己換（跟著同步）。</li>
    </ul>
  </div></aside>
</main>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ════════════════ 雪球（跟 lume/design-history/2026-10-20_3D聖誕雪球.html 同一顆，縮成元件） ════════════════
const FOX_URL = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/Fox/glTF-Binary/Fox.glb';
let foxPromise = null;
const loadFox = () => foxPromise ??= new GLTFLoader().loadAsync(FOX_URL).catch(() => null);

function flakeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const flakeTex = flakeTexture();

function softEnv(renderer) {
  const env = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 48, 24), col = [], p = g.attributes.position;
  const top = new THREE.Color(0x26314f), mid = new THREE.Color(0x0d1020), bot = new THREE.Color(0x3a2618);
  for (let i = 0; i < p.count; i++) {
    const k = p.getY(i) / 10, c = k > 0 ? mid.clone().lerp(top, k) : mid.clone().lerp(bot, -k);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  env.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const soft = document.createElement('canvas'); soft.width = soft.height = 128;
  const sg = soft.getContext('2d'), sr = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
  sr.addColorStop(0, '#fff'); sr.addColorStop(.35, 'rgba(255,255,255,.55)'); sr.addColorStop(1, 'rgba(255,255,255,0)');
  sg.fillStyle = sr; sg.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(soft);
  for (const [w, h, c, x, y, z] of [[7, 4.5, new THREE.Color(.95, .82, .66), 5, 6, 5], [5, 7, new THREE.Color(.35, .45, .7), -7, 2, -4]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, map: tex, transparent: true, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  }
  return new THREE.PMREMGenerator(renderer).fromScene(env, .035).texture;
}

/**
 * 在 canvas 上建一顆雪球。opts.fit：鏡頭留白比例（越大球越小）；opts.base：要不要底座；
 * opts.orbit：可不可以拖著轉；opts.lift：鏡頭高度。回傳 { shake, hop, setActive, resize }。
 */
function makeGlobe(canvas, opts = {}) {
  const o = { fit: 1, base: true, orbit: true, flakes: 900, lift: 2.2, autoRotate: .7, petScale: 1, clearGlass: false, ...opts };
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  scene.environment = softEnv(renderer);

  const camera = new THREE.PerspectiveCamera(30, 1, .1, 60);
  const controls = new OrbitControls(camera, canvas);
  controls.enabled = o.orbit; controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true;
  controls.minPolarAngle = .5; controls.maxPolarAngle = Math.PI * .55;
  controls.autoRotate = true; controls.autoRotateSpeed = o.autoRotate;

  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a2a22, .55));
  const key = new THREE.DirectionalLight(0xffd9b0, 1.4); key.position.set(3.5, 6.5, 4); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); key.shadow.bias = -.0005;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb4ff, .9); rim.position.set(-4, 3, -4); scene.add(rim);

  const globe = new THREE.Group(); scene.add(globe);
  const R = 1.45, BASE_H = o.base ? .62 : .0, CY = BASE_H + R * .72, GY = CY - R * .55;
  const GROUND_R = Math.sqrt(R * R - (R * .55) ** 2) - .02;
  const mat = (c, x = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .55, ...x });
  const glow = (c, i = 2) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, roughness: .4 });
  const mesh = (geo, m, cast = true) => { const x = new THREE.Mesh(geo, m); x.castShadow = cast; x.receiveShadow = true; return x; };
  const hAt = (x, z) => {
    const r = Math.hypot(x, z) / GROUND_R, edge = 1 - Math.pow(Math.min(r, 1), 4);
    return .16 * (1 - r * r) + edge * (.025 * Math.sin(x * 6 + 1) * Math.cos(z * 5) + .018 * Math.sin((x + z) * 9));
  };
  const groundY = (x, z) => GY + hAt(x, z);
  const place = (obj, x, z, ry = 0) => { obj.position.set(x, groundY(x, z), z); obj.rotation.y = ry; globe.add(obj); return obj; };

  if (o.base) {
    const pts = [[0, 0], [1.62, 0], [1.66, .04], [1.66, .12], [1.6, .16], [1.52, .2], [1.5, .46], [1.42, .52], [1.36, .58], [1.3, BASE_H], [0, BASE_H]].map(([x, y]) => new THREE.Vector2(x, y));
    const base = mesh(new THREE.LatheGeometry(pts, 96), new THREE.MeshPhysicalMaterial({ color: 0x5a3220, roughness: .38, clearcoat: .8, clearcoatRoughness: .25 }));
    globe.add(base);
    const gold = new THREE.MeshStandardMaterial({ color: 0xd9a74e, metalness: 1, roughness: .22 });
    for (const [y, r, t] of [[.17, 1.56, .028], [.5, 1.47, .025]]) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r, t, 12, 120), gold); ring.rotation.x = Math.PI / 2; ring.position.y = y; globe.add(ring);
    }
  }
  // 放在卡片上（背景透明）時不能用「透光折射」玻璃：它會把透明背景算成一片白霧。
  // 改用半透明玻璃＋反光，卡片的毛玻璃透得過來。
  const glass = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 72), o.clearGlass
    ? new THREE.MeshPhysicalMaterial({ color: 0xdfeaff, transparent: true, opacity: .16, roughness: .05, metalness: 0,
        clearcoat: 1, clearcoatRoughness: .1, specularIntensity: .6, envMapIntensity: 1.6 })
    : new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: .02, transmission: 1, thickness: .35, ior: 1.33, clearcoat: .7, clearcoatRoughness: .16,
    specularIntensity: .3, envMapIntensity: .9, attenuationColor: new THREE.Color(0xe8f3ff), attenuationDistance: 6,
  }));
  glass.material.depthWrite = false; glass.position.y = CY; globe.add(glass);

  { // 雪地
    const rings = 24, segs = 110, pos = [], idx = [];
    pos.push(0, hAt(0, 0), 0);
    for (let i = 1; i <= rings; i++) for (let j = 0; j < segs; j++) {
      const r = GROUND_R * i / rings, a = j / segs * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r; pos.push(x, hAt(x, z), z);
    }
    for (let j = 0; j < segs; j++) idx.push(0, 1 + (j + 1) % segs, 1 + j);
    for (let i = 1; i < rings; i++) { const a0 = 1 + (i - 1) * segs, a1 = 1 + i * segs;
      for (let j = 0; j < segs; j++) { const j1 = (j + 1) % segs; idx.push(a0 + j, a0 + j1, a1 + j, a0 + j1, a1 + j1, a1 + j); } }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
    const snow = mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xf3f7ff, roughness: .85, sheen: 1, sheenColor: new THREE.Color(0xcfe0ff) }), false);
    snow.position.y = GY; globe.add(snow);
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(GROUND_R, GROUND_R * .9, Math.max(GY - BASE_H, .05) + .02, 80, 1, true), mat(0xe9eef8, { roughness: .9 }));
    skirt.position.y = (GY + BASE_H) / 2; globe.add(skirt);
  }
  { // 小屋
    const h = new THREE.Group(), wood = mat(0x8a3a2c, { roughness: .7 }), snowM = mat(0xf6f9ff, { roughness: .9 });
    const body = mesh(new THREE.BoxGeometry(.42, .3, .36), wood); body.position.y = .15; h.add(body);
    for (const s of [-1, 1]) {
      const roof = mesh(new THREE.BoxGeometry(.5, .035, .29), snowM); roof.position.set(0, .37, s * .1); roof.rotation.x = s * .62; h.add(roof);
      const under = mesh(new THREE.BoxGeometry(.48, .02, .27), mat(0x4a2418)); under.position.set(0, .35, s * .095); under.rotation.x = s * .62; h.add(under);
    }
    const gable = new THREE.Shape(); gable.moveTo(-.21, 0); gable.lineTo(.21, 0); gable.lineTo(0, .13); gable.closePath();
    for (const s of [-1, 1]) { const g = mesh(new THREE.ExtrudeGeometry(gable, { depth: .01, bevelEnabled: false }), wood); g.rotation.y = s * Math.PI / 2; g.position.set(s * .21, .3, 0); h.add(g); }
    const chim = mesh(new THREE.BoxGeometry(.06, .14, .06), mat(0x6b6f7a)); chim.position.set(.11, .43, -.06); h.add(chim);
    const door = mesh(new THREE.BoxGeometry(.08, .14, .01), mat(0x4a2418)); door.position.set(0, .07, .182); h.add(door);
    const win = glow(0xffc46b, 1.5);
    for (const x of [-.13, .13]) { const w = mesh(new THREE.BoxGeometry(.075, .07, .01), win, false); w.position.set(x, .17, .182); h.add(w); }
    const pl = new THREE.PointLight(0xffb15c, .55, .9, 2); pl.position.set(0, .18, .32); h.add(pl);
    place(h, 0, -.05);
  }
  const twinkles = [];
  const tree = (x, z, s, lights) => {
    const t = new THREE.Group(), green = mat(0x1f5a3c, { roughness: .8 }), white = mat(0xf6f9ff, { roughness: .9 });
    const trunk = mesh(new THREE.CylinderGeometry(.025, .03, .08, 10), mat(0x5b3a26)); trunk.position.y = .04; t.add(trunk);
    [[.15, .2, .14], [.12, .18, .26], [.085, .15, .36]].forEach(([r, h, y]) => {
      const c = mesh(new THREE.ConeGeometry(r, h, 16), green); c.position.y = y; t.add(c);
      const cap = mesh(new THREE.ConeGeometry(r * .62, h * .38, 16), white); cap.position.y = y + h * .33; t.add(cap);
    });
    if (lights) {
      const star = mesh(new THREE.OctahedronGeometry(.032), glow(0xffd36b, 4), false); star.position.y = .47; t.add(star);
      twinkles.push({ m: star.material, base: 4, sp: 2.2, ph: 0 });
      const cols = [0xff5a5a, 0xffd36b, 0x6bc8ff, 0x7dff9a, 0xff8de1];
      for (let i = 0; i < 22; i++) { const k = i / 22, y = .1 + k * .32, r = .15 * (1 - k * .78) + .008, a = k * Math.PI * 7;
        const m = glow(cols[i % 5], 3), b = mesh(new THREE.SphereGeometry(.011, 8, 8), m, false); b.position.set(Math.cos(a) * r, y, Math.sin(a) * r); t.add(b);
        twinkles.push({ m, base: 3, sp: 1.5 + Math.random() * 3, ph: Math.random() * 6 }); }
    }
    t.scale.setScalar(s); place(t, x, z, Math.random() * 6);
  };
  tree(-.86, -.72, 1.12, true); tree(.95, -.62, .9); tree(-1.1, .12, .72); tree(.66, -.95, .68); tree(1.12, .1, .7); tree(-.42, -1.1, .66);
  { // 雪人
    const s = new THREE.Group(), w = mat(0xfafcff, { roughness: .85 });
    const b1 = mesh(new THREE.SphereGeometry(.085, 20, 16), w); b1.position.y = .07; s.add(b1);
    const b2 = mesh(new THREE.SphereGeometry(.06, 20, 16), w); b2.position.y = .18; s.add(b2);
    const scarf = mesh(new THREE.TorusGeometry(.045, .014, 8, 20), mat(0xd23b3b)); scarf.rotation.x = Math.PI / 2; scarf.position.y = .145; s.add(scarf);
    const nose = mesh(new THREE.ConeGeometry(.01, .045, 8), mat(0xff8a2b)); nose.rotation.x = Math.PI / 2; nose.position.set(0, .185, .075); s.add(nose);
    const brim = mesh(new THREE.CylinderGeometry(.05, .05, .008, 16), mat(0x22252e)); brim.position.y = .232; s.add(brim);
    const top = mesh(new THREE.CylinderGeometry(.033, .035, .05, 16), mat(0x22252e)); top.position.y = .26; s.add(top);
    place(s, .55, .78, -.5);
  }

  const blob = (r, m, sx = 1, sy = 1, sz = 1) => { const x = mesh(new THREE.SphereGeometry(r, 24, 18), m); x.scale.set(sx, sy, sz); return x; };
  const eye = (x, y, z, s = .011) => { const g = new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(s, 12, 10), mat(0x14141a, { roughness: .2 }), false));
    const hl = mesh(new THREE.SphereGeometry(s * .35, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), false); hl.position.set(s * .35, s * .35, s * .75); g.add(hl); g.position.set(x, y, z); return g; };
  const pink = mat(0xffa3b8);
  const bear = () => { const g = new THREE.Group(), b = new THREE.Group(); g.add(b); const w = mat(0xfdfcf8, { roughness: .7 });
    b.add(blob(.085, w, 1.12, .92, 1).translateY(.088));
    for (const s of [-1, 1]) { b.add(blob(.026, w).translateX(s * .055).translateY(.162)); b.add(eye(s * .03, .1, .077)); b.add(blob(.016, pink, 1.2, .6, .35).translateX(s * .056).translateY(.078).translateZ(.068)); }
    const limbs = []; for (const s of [-1, 1]) { const arm = blob(.018, w); arm.position.set(s * .088, .07, .02); b.add(arm); limbs.push(arm);
      const leg = blob(.022, w, 1, .8, 1.1); leg.position.set(s * .04, .016, 0); g.add(leg); limbs.push(leg); }
    g.userData = { body: b, limbs }; return g; };
  const bunny = (c) => { const g = new THREE.Group(), b = new THREE.Group(); g.add(b); const w = mat(c, { roughness: .75 });
    b.add(blob(.065, w, 1, .88, 1.25).translateY(.06)); const head = blob(.05, w); head.position.set(0, .12, .055); b.add(head);
    for (const s of [-1, 1]) { const ear = blob(.026, w, .38, 1.7, .3); ear.position.set(s * .022, .2, .04); ear.rotation.z = s * -.18; b.add(ear); b.add(eye(s * .026, .13, .096, .009)); }
    b.add(blob(.022, mat(0xffffff)).translateY(.07).translateZ(-.08)); g.userData = { body: b }; return g; };
  const penguin = () => { const g = new THREE.Group(), b = new THREE.Group(); g.add(b);
    b.add(blob(.07, mat(0x1d2330, { roughness: .45 }), 1, 1.38, .95).translateY(.098)); b.add(blob(.058, mat(0xfafafa), .86, 1.2, .62).translateY(.09).translateZ(.034));
    for (const s of [-1, 1]) { b.add(eye(s * .022, .155, .06, .008)); const ft = blob(.02, mat(0xffa12b), 1, .35, 1.4); ft.position.set(s * .028, .006, .03); g.add(ft); }
    const beak = mesh(new THREE.ConeGeometry(.012, .03, 8), mat(0xffa12b)); beak.rotation.x = Math.PI / 2; beak.position.set(0, .14, .078); b.add(beak);
    const scarf = mesh(new THREE.TorusGeometry(.05, .012, 8, 20), mat(0xd23b3b)); scarf.rotation.x = Math.PI / 2; scarf.position.y = .12; b.add(scarf);
    g.userData = { body: b }; return g; };
  const animals = [
    { o: bear(), r: .62, speed: .55, ph: 0, kind: 'run' },
    { o: bunny(0xf2e9dc), r: .8, speed: .34, ph: 2.2, kind: 'hop' },
    { o: bunny(0xbf9470), r: .72, speed: -.3, ph: 4.4, kind: 'hop' },
    { o: penguin(), r: .46, speed: .16, ph: 1.0, kind: 'waddle' },
  ];
  // 小區域放雪球時動物放大（2026-10-20 使用者：球小了動物要大一點才看得清楚）。
  animals.forEach(a => { a.o.scale.setScalar(o.petScale); globe.add(a.o); });
  let fox = null, foxModel = null;
  loadFox().then(gltf => {
    if (!gltf) return;
    const m = SkeletonUtils.clone(gltf.scene); m.scale.setScalar(.0017 * o.petScale); foxModel = m;
    m.traverse(x => { if (x.isMesh) { x.castShadow = true; x.receiveShadow = true; } });
    const holder = new THREE.Group(); holder.add(m); globe.add(holder);
    const mixer = new THREE.AnimationMixer(m), clip = n => mixer.clipAction(gltf.animations.find(a => a.name === n));
    fox = { holder, mixer, run: clip('Run'), look: clip('Survey'), th: 2.6, mode: 'run', until: 7 }; fox.run.play();
  });

  // 雪花
  const N = o.flakes, fP = new Float32Array(N * 3), fV = new Float32Array(N * 3), fR = new Float32Array(N);
  const spawn = (i, any) => { for (;;) { const x = (Math.random() * 2 - 1) * R * .9, z = (Math.random() * 2 - 1) * R * .9;
    const y = any ? GY + Math.random() * R * 1.45 : CY + R * (.2 + Math.random() * .7);
    if (x * x + (y - CY) ** 2 + z * z < (R * .92) ** 2 && y > groundY(x, z) + .02) { fP.set([x, y, z], i * 3); fV.set([0, -.03, 0], i * 3); fR[i] = 0; return; } } };
  for (let i = 0; i < N; i++) spawn(i, true);
  const fG = new THREE.BufferGeometry(); fG.setAttribute('position', new THREE.BufferAttribute(fP, 3));
  const fl = new THREE.Points(fG, new THREE.PointsMaterial({ size: .034, map: flakeTex, transparent: true, depthWrite: false, color: 0xdfe6f2 }));
  fl.renderOrder = 3; globe.add(fl);

  let swirl = 0, wobble = 0, hopUntil = 0;
  function shake() {
    swirl = 1.6; wobble = 1; hopUntil = clock.elapsedTime + 1.2;
    for (let i = 0; i < N; i++) { fR[i] = 0; fV[i * 3] = (Math.random() - .5) * 1.2; fV[i * 3 + 1] = .6 + Math.random() * 1.3; fV[i * 3 + 2] = (Math.random() - .5) * 1.2; }
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    const v = THREE.MathUtils.degToRad(camera.fov) / 2, hh = Math.atan(Math.tan(v) * camera.aspect);
    const half = o.base ? 1.75 : 1.5;
    const d = Math.max(half / Math.tan(v), half / Math.tan(hh)) * o.fit + .3;
    const ty = o.base ? 1.5 : CY;
    controls.target.set(0, ty, 0);
    const dir = camera.position.clone().sub(controls.target); if (dir.lengthSq() < .01) dir.set(0, o.lift - ty, 1);
    camera.position.copy(controls.target).add(dir.normalize().multiplyScalar(d));
  }
  { const e = THREE.MathUtils.degToRad(o.elev ?? 30), ty0 = o.base ? 1.5 : CY; camera.position.set(0, ty0 + Math.sin(e) * 6, Math.cos(e) * 6); }
  resize();

  const clock = new THREE.Clock();
  let active = true;
  function frame() {
    if (!active) return;
    const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
    const excited = t < hopUntil;
    for (const a of animals) {
      const th = a.ph + t * a.speed, x = Math.cos(th) * a.r, z = Math.sin(th) * a.r, dir = Math.sign(a.speed);
      a.o.position.set(x, groundY(x, z), z); a.o.rotation.y = Math.atan2(-Math.sin(th) * dir, Math.cos(th) * dir);
      const b = a.o.userData.body;
      if (excited) { b.position.y = Math.abs(Math.sin(t * 14)) * .09; b.rotation.z = 0; continue; }   // 記一筆：大家跳起來
      if (a.kind === 'run') { const p = t * 13; b.position.y = Math.abs(Math.sin(p)) * .028; a.o.userData.limbs.forEach((l, i) => l.position.z = Math.sin(p + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI : 0)) * .025); }
      else if (a.kind === 'hop') { const p = (t * 1.9 + a.ph) % 1, up = Math.sin(p * Math.PI); b.position.y = up * .11; const sq = p < .12 || p > .9 ? .82 : 1 + up * .08; b.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq)); }
      else { b.rotation.z = Math.sin(t * 7) * .16; b.position.y = Math.abs(Math.sin(t * 7)) * .01; }
    }
    if (fox) {
      fox.mixer.update(dt);
      if (t > fox.until) { const nx = fox.mode === 'run' ? 'look' : 'run'; fox[nx].reset().play(); fox[fox.mode].crossFadeTo(fox[nx], .35, false); fox.mode = nx; fox.until = t + (nx === 'run' ? 7 : 3); }
      if (fox.mode === 'run') fox.th += dt * .5;
      const x = Math.cos(fox.th) * .93, z = Math.sin(fox.th) * .93;
      fox.holder.position.set(x, groundY(x, z), z); fox.holder.rotation.y = Math.atan2(-Math.sin(fox.th), Math.cos(fox.th));
    }
    for (const k of twinkles) k.m.emissiveIntensity = k.base * (.55 + .45 * Math.sin(t * k.sp + k.ph));
    swirl *= Math.pow(.35, dt);
    for (let i = 0; i < N; i++) {
      const j = i * 3;
      if (fR[i] > 0) { fR[i] -= dt; if (fR[i] <= 0) spawn(i, false); continue; }
      let x = fP[j], y = fP[j + 1], z = fP[j + 2], vx = fV[j], vy = fV[j + 1], vz = fV[j + 2];
      vy -= .9 * dt; const dr = Math.pow(.18, dt); vx *= dr; vz *= dr; vy = Math.max(vy * dr, -.09 - (i % 7) * .006);
      vx += (-z * swirl * 1.4 + Math.sin(t * .7 + i) * .02) * dt * 3; vz += (x * swirl * 1.4 + Math.cos(t * .6 + i * 1.3) * .02) * dt * 3;
      x += vx * dt; y += vy * dt; z += vz * dt;
      const dy = y - CY, d = Math.sqrt(x * x + dy * dy + z * z), lim = R * .94;
      if (d > lim) { const k = lim / d; x *= k; z *= k; y = CY + dy * k; const nx = x / lim, ny = dy / lim, nz = z / lim, dot = vx * nx + vy * ny + vz * nz;
        if (dot > 0) { vx -= 1.6 * dot * nx; vy -= 1.6 * dot * ny; vz -= 1.6 * dot * nz; } }
      const gy = groundY(x, z) + .008; if (y < gy) { y = gy; vx = vy = vz = 0; fR[i] = 3 + Math.random() * 9; }
      fP[j] = x; fP[j + 1] = y; fP[j + 2] = z; fV[j] = vx; fV[j + 1] = vy; fV[j + 2] = vz;
    }
    fG.attributes.position.needsUpdate = true;
    wobble *= Math.pow(.02, dt);
    globe.position.x = Math.sin(t * 38) * .05 * wobble; globe.rotation.z = Math.sin(t * 31) * .03 * wobble;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  new ResizeObserver(resize).observe(canvas);
  return {
    shake,
    setActive(v) { if (v === active) return; active = v; if (v) { clock.getDelta(); requestAnimationFrame(frame); } },
    resize,
    // 設計稿拉桿用：動物大小、鏡頭遠近（雪球在格子裡的大小）即時調。
    setPetScale(k) { o.petScale = k; animals.forEach(a => a.o.scale.setScalar(k)); foxModel?.scale.setScalar(.0017 * k); },
    setFit(k) { o.fit = k; resize(); },
    dispose() { active = false; renderer.dispose(); renderer.forceContextLoss(); },
  };
}

// ════════════════ 記帳畫面 ════════════════
const items = [
  ['豪點的外送（幾次合併）', 1, 400], ['唱歌', 1, 493], ['酒', 0, 238], ['百家樂', 1, 100], ['豪給我', 1, 1000],
  ['家樂福 524/2', 0, 262], ['燒烤', 0, 290], ['四季春', 0, 40],
];
const money = v => 'NT$' + Math.abs(v).toLocaleString('en-US');
function listHtml() {
  let bal = 543;
  const rows = items.map(([n, p, a]) => {
    const r = `<div class="row"><div class="date ${p ? 'dplus' : 'dminus'}"><div><b>20</b><small>10月</small></div></div>
      <div class="t"><b>${n}</b><span>${p ? '豪支出' : '岑支出'}・2026</span></div>
      <div class="m"><b class="${p ? 'plus' : 'minus'}">${p ? '+' : '−'}${money(a)}</b><span>結餘 ${bal >= 0 ? '+' : '−'}${money(bal)}</span></div></div>`;
    bal -= p ? a : -a; return r;
  }).join('');
  return `<div class="hint">明細・新的在上面・點一筆看詳細</div>
    <div class="day"><b>今天・10/20（二）</b><span>28 筆・<b class="plus">+NT$795</b></span></div>
    <div class="card">${rows}</div>`;
}
const card = (globe) => `<div class="card sumG">
    <div class="left">
      <div class="lab">目前結餘</div><div class="bal">+NT$543</div>
      <div class="mini"><div><span>豪支出</span><b class="plus">9,337</b></div><div><span>岑支出</span><b class="minus">8,794</b></div><div><span>筆數</span><b>29</b></div></div>
    </div>
    <div class="globeSlot">${globe}</div>
  </div>`;
const top = `<div class="status"><span>9:41</span><span>●●● 5G 🔋</span></div>
  <div class="topbar"><img src="../assets/logo/logo_240.png" alt="我的記帳"><div class="cloud" title="雲端同步">☁</div></div>`;
const bottom = `<div class="bottom"><div class="act p">＋ 豪支出</div><div class="act m">− 岑支出</div></div>`;

// ════════════════ 背景 ════════════════
// layer：背景那層的 HTML（圖片或 CSS 畫的），fx：上面再疊的動態（下雪、極光）
const snowDots = (n, cls) => Array.from({ length: n }, (_, i) =>
  `<i class="${cls}" style="left:${(i * 37 + 11) % 100}%;animation-delay:${-(i * .73) % 9}s;animation-duration:${7 + (i % 6) * 1.3}s;width:${2 + (i % 3)}px;height:${2 + (i % 3)}px;opacity:${.35 + (i % 4) * .15}"></i>`).join('');
const BGS = [
  { id: 'starry', name: '星夜柔光散景', tag: '你的圖', layer: `<div class="bgImg" style="background-image:url(bg/starry_bokeh.jpg)"></div>`,
    note: '粉、金、綠三團柔光，跟 App 的豪支出（綠）、岑支出（橘）顏色很搭；中間乾淨，卡片疊上去不亂。' },
  { id: 'nebula', name: '紫夜星雲', tag: '你的圖', layer: `<div class="bgImg" style="background-image:url(bg/purple_nebula.jpg)"></div>`,
    note: '整片紫色比較夢幻、統一；金色的錢數字在紫底上特別顯眼。' },
  { id: 'ambient', name: '原本的四色光暈', tag: '現在', layer: `<div class="amb"></div>`,
    note: '現在 App 用的：深色底＋四個角落的藍、橘、綠、紫光暈（純程式畫的，最輕）。' },
  { id: 'aurora', name: '極光', tag: '會動', layer: `<div class="aurora"><span></span><span></span><span></span></div>`,
    note: '綠紫兩條極光在上面慢慢流動（純 CSS，不用圖片），冬天感。' },
  { id: 'snow', name: '雪夜', tag: '會動', layer: `<div class="snowSky"></div><div class="snowFx">${snowDots(46, 'sf')}</div>`,
    note: '深藍夜空、整個畫面慢慢飄雪，跟雪球最搭（雪是 CSS 畫的，很輕）。' },
  { id: 'gold', name: '暖金散景', tag: '溫暖', layer: `<div class="goldSky"></div><div class="goldFx">${snowDots(22, 'gb')}</div>`,
    note: '暗咖啡底＋暖金色的大顆散景光點，像聖誕夜的燈，比較溫暖。' },
];
let bgId = 'starry', drift = true;

const screen = document.getElementById('screen');
function render() {
  const b = BGS.find(x => x.id === bgId);
  screen.querySelector('.bgLayer').innerHTML = b.layer;
  screen.classList.toggle('drift', drift);
  document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('on', x.dataset.bg === bgId));
  document.getElementById('bgNote').innerHTML = `<b>${b.name}</b>${b.tag ? `<span class="tg">${b.tag}</span>` : ''}<br>${b.note}`;
}
screen.innerHTML = `<div class="bgLayer"></div><div class="scroll">${top}${card('<canvas class="globe" id="g"></canvas>')}${listHtml()}</div>${bottom}`;
document.getElementById('bgPick').innerHTML = BGS.map(b => `<button class="bgOpt" data-bg="${b.id}"><span class="sw sw-${b.id}"></span>${b.name}<small>${b.tag}</small></button>`).join('');
document.getElementById('bgPick').onclick = e => { const x = e.target.closest('[data-bg]'); if (x) { bgId = x.dataset.bg; render(); } };
document.getElementById('drift').onclick = e => { drift = !drift; e.currentTarget.classList.toggle('on', drift); render(); };
render();

const g = makeGlobe(document.getElementById('g'), { fit: 1, orbit: true, flakes: 700, petScale: 2.6, autoRotate: .9, clearGlass: true, elev: 40 });
let x0 = 0, y0 = 0, t0 = 0; const cv = document.getElementById('g');
cv.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); });
cv.addEventListener('pointerup', e => { if (Math.hypot(e.clientX - x0, e.clientY - y0) < 6 && performance.now() - t0 < 350) g.shake(); });
window.bgDemo = { set: id => { bgId = id; render(); } };
</script>
