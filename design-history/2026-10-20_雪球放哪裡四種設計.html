<title>雪球放哪裡</title>
<!--
  2026-10-20 使用者要求：把 3D 聖誕雪球（lume/design-history/2026-10-20_3D聖誕雪球.html）
  找個地方塞進「我的記帳」，先給設計稿。四種放法，每種都是完整可以點的記帳畫面，
  雪球是真的 3D（可以拖著轉）。A 是一般 App 最常見的「頂部主視覺」。

<style>
  :root {
    --bg: #0C0C13; --ink: #F3F2F8; --ink2: #A3A2B2; --ink3: #74738A;
    --glass: rgba(255,255,255,.07); --edge: rgba(255,255,255,.14);
    --plus: #5FE08D; --minus: #FFB066; --accent: #FFC857;
  }
  * { box-sizing: border-box; }
  html { background: #05060b; }
  body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #1b2140 0%, transparent 60%), radial-gradient(900px 600px at 110% 110%, #2a1a2a 0%, transparent 60%), #05060b; }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; color: var(--ink2); font-size: 14px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px; max-width: 1100px; margin: 0 auto; }
  .tab { border: 1px solid var(--edge); background: var(--glass); color: var(--ink2); border-radius: 999px;

  .tab.on { background: rgba(255,200,87,.16); border-color: rgba(255,200,87,.5); color: var(--accent); font-weight: 700; }
  .tab small { opacity: .7; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 20px 60px; display: flex; gap: 36px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

  /* 手機外框：不能用 height:100% + flex，會被壓扁（見記憶 html_mockup_phone_shell_css_bug） */
  .phone { flex-shrink: 0; width: 375px; min-height: 780px; height: 780px; border-radius: 46px; padding: 12px;
    background: #111; box-shadow: 0 0 0 2px #2a2a33, 0 30px 80px rgba(0,0,0,.6); position: relative; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--bg); }
  .amb { position: absolute; inset: 0; pointer-events: none;

                radial-gradient(260px 240px at 100% 35%, rgba(194,82,28,.28), transparent 70%),
                radial-gradient(260px 240px at 95% 85%, rgba(14,124,108,.28), transparent 70%),
                radial-gradient(240px 240px at 0% 100%, rgba(108,47,206,.3), transparent 70%); }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 120px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .status { height: 22px; display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); padding: 0 10px; margin-bottom: 6px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 4px; }
  .topbar img { height: 34px; }
  .cloud { width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink2); font-size: 19px; }

  .card { position: relative; border-radius: 20px; background: rgba(255,255,255,.075); border: 1px solid var(--edge);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .summary { padding: 20px 20px 16px; margin-top: 8px; }
  .summary .lab { font-size: 14px; color: var(--ink2); }
  .summary .bal { font-size: 40px; font-weight: 900; letter-spacing: -1px; color: var(--plus); font-variant-numeric: tabular-nums; }
  .stats { display: flex; margin-top: 12px; }
  .stats div { flex: 1; } .stats b { display: block; font-size: 15px; } .stats span { font-size: 12px; color: var(--ink3); }
  .hint { font-size: 12.5px; color: var(--ink2); margin: 16px 4px 4px; }
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 6px 8px; }
  .day b { font-size: 15px; } .day span { font-size: 12.5px; color: var(--ink3); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08); }
  .row:first-child { border-top: 0; }
  .date { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; text-align: center; line-height: 1; }
  .date b { font-size: 16px; display: block; } .date small { font-size: 10px; color: var(--ink2); }
  .row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { font-size: 12px; color: var(--ink3); }
  .row .m { text-align: right; } .row .m b { font-size: 15.5px; display: block; } .row .m span { font-size: 11.5px; color: var(--ink3); }
  .plus { color: var(--plus); } .minus { color: var(--minus); }
  .dplus { background: rgba(95,224,141,.12); } .dplus b { color: var(--plus); }
  .dminus { background: rgba(255,176,102,.12); } .dminus b { color: var(--minus); }

  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 22px; display: flex; gap: 10px;
    background: rgba(12,12,19,.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid rgba(255,255,255,.08); z-index: 5; }
  .act { flex: 1; border-radius: 16px; padding: 15px 0; text-align: center; font-weight: 800; font-size: 16px; cursor: pointer; user-select: none; border: 1px solid; }
  .act.p { color: var(--plus); background: rgba(95,224,141,.13); border-color: rgba(95,224,141,.45); }
  .act.m { color: var(--minus); background: rgba(255,176,102,.13); border-color: rgba(255,176,102,.45); }
  .act:active { transform: scale(.97); }

  .toast { position: absolute; left: 50%; top: 58px; transform: translate(-50%, -20px); opacity: 0; z-index: 20;
    background: rgba(30,30,44,.92); border: 1px solid var(--edge); padding: 9px 14px; border-radius: 999px; font-size: 13px;
    transition: all .3s ease; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  canvas.globe { display: block; touch-action: none; cursor: grab; }

  /* A 頂部主視覺 */
  .heroA { position: relative; height: 270px; margin: -6px -16px 0; }

  /* B 結餘卡合體 */
  .summaryB { padding: 20px 20px 16px; margin-top: 50px; min-height: 160px; }
  .summaryB .left { width: 52%; }
  .globeB { position: absolute; right: -8px; top: -62px; width: 188px; height: 220px; }
  .globeB canvas { width: 100%; height: 100%; }

  /* C 浮動雪球 */
  .fab { position: absolute; right: 14px; bottom: 96px; width: 92px; height: 104px; z-index: 6; border-radius: 26px; }
  .fab canvas { width: 100%; height: 100%; }
  .fab .ping { position: absolute; top: 2px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .sheet { position: absolute; inset: 0; z-index: 30; background: rgba(8,8,14,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .sheet.show { opacity: 1; pointer-events: auto; }
  .sheet .big { flex: 1; } .sheet .big canvas { width: 100%; height: 100%; }
  .sheet .bar { padding: 0 18px 26px; display: flex; gap: 10px; }
  .sheet .bar button { flex: 1; border-radius: 15px; padding: 14px 0; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    border: 1px solid var(--edge); background: var(--glass); color: var(--ink); }
  .sheet .bar .shake { background: linear-gradient(180deg, #f2c46d, #d6963e); color: #2a1a05; border-color: rgba(255,220,150,.6); }
  .sheet .head { padding: 20px 20px 0; display: flex; justify-content: space-between; align-items: center; }
  .sheet .head b { font-size: 17px; } .sheet .head span { font-size: 12.5px; color: var(--ink2); display: block; margin-top: 2px; }
  .x { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--edge); background: var(--glass); color: var(--ink); font-size: 16px; cursor: pointer; }

  /* D 下拉同步 */
  .pull { position: absolute; left: 0; right: 0; top: 0; height: 0; overflow: hidden; z-index: 1; }
  .pull canvas { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 260px; height: 260px; }
  .pull .msg { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 12.5px; color: var(--ink2); }
  .dragArea { position: absolute; inset: 0; z-index: 2; transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
  .dragArea.dragging { transition: none; }
  .pullTip { text-align: center; font-size: 11.5px; color: var(--ink3); margin: -2px 0 2px; }

  aside { width: 420px; max-width: 100%; }
  aside .card { padding: 20px 22px; }
  aside h2 { margin: 0 0 4px; font-size: 20px; }
  aside .tagline { color: var(--accent); font-size: 13.5px; margin-bottom: 12px; }
  aside h3 { font-size: 14.5px; margin: 16px 0 6px; color: var(--ink); }
  aside ul { margin: 0; padding-left: 18px; color: var(--ink2); font-size: 14px; line-height: 1.7; }
  aside .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  aside .pc div { background: rgba(255,255,255,.04); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink2); line-height: 1.6; }
  aside .pc b { display: block; color: var(--ink); margin-bottom: 2px; }
  .common { margin-top: 14px; }
  .loadingNote { color: var(--ink3); font-size: 12.5px; margin-top: 10px; }
  @media (max-width: 440px) { .phone { transform: scale(.92); transform-origin: top center; margin-bottom: -60px; } }

  <p>每一種都是完整的「我的記帳」畫面，可以點、可以捲。雪球是真的 3D，拖著可以轉。按「＋ 豪支出／− 岑支出」雪球會搖一下（記一筆的小回饋）。</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ════════════════ 雪球（跟 lume/design-history/2026-10-20_3D聖誕雪球.html 同一顆，縮成元件） ════════════════
const FOX_URL = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/Fox/glTF-Binary/Fox.glb';
let foxPromise = null;
const loadFox = () => foxPromise ??= new GLTFLoader().loadAsync(FOX_URL).catch(() => null);

function flakeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const flakeTex = flakeTexture();

function softEnv(renderer) {
  const env = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 48, 24), col = [], p = g.attributes.position;
  const top = new THREE.Color(0x26314f), mid = new THREE.Color(0x0d1020), bot = new THREE.Color(0x3a2618);
  for (let i = 0; i < p.count; i++) {
    const k = p.getY(i) / 10, c = k > 0 ? mid.clone().lerp(top, k) : mid.clone().lerp(bot, -k);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  env.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const soft = document.createElement('canvas'); soft.width = soft.height = 128;
  const sg = soft.getContext('2d'), sr = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
  sr.addColorStop(0, '#fff'); sr.addColorStop(.35, 'rgba(255,255,255,.55)'); sr.addColorStop(1, 'rgba(255,255,255,0)');
  sg.fillStyle = sr; sg.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(soft);
  for (const [w, h, c, x, y, z] of [[7, 4.5, new THREE.Color(.95, .82, .66), 5, 6, 5], [5, 7, new THREE.Color(.35, .45, .7), -7, 2, -4]]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, map: tex, transparent: true, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  }
  return new THREE.PMREMGenerator(renderer).fromScene(env, .035).texture;
}

/**
 * 在 canvas 上建一顆雪球。opts.fit：鏡頭留白比例（越大球越小）；opts.base：要不要底座；
 * opts.orbit：可不可以拖著轉；opts.lift：鏡頭高度。回傳 { shake, hop, setActive, resize }。
 */
function makeGlobe(canvas, opts = {}) {
  const o = { fit: 1, base: true, orbit: true, flakes: 900, lift: 2.2, autoRotate: .7, petScale: 1, ...opts };
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  scene.environment = softEnv(renderer);

  const camera = new THREE.PerspectiveCamera(30, 1, .1, 60);
  const controls = new OrbitControls(camera, canvas);
  controls.enabled = o.orbit; controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true;
  controls.minPolarAngle = .5; controls.maxPolarAngle = Math.PI * .55;
  controls.autoRotate = true; controls.autoRotateSpeed = o.autoRotate;

  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a2a22, .55));
  const key = new THREE.DirectionalLight(0xffd9b0, 1.4); key.position.set(3.5, 6.5, 4); key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); key.shadow.bias = -.0005;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb4ff, .9); rim.position.set(-4, 3, -4); scene.add(rim);

  const globe = new THREE.Group(); scene.add(globe);
  const R = 1.45, BASE_H = o.base ? .62 : .0, CY = BASE_H + R * .72, GY = CY - R * .55;
  const GROUND_R = Math.sqrt(R * R - (R * .55) ** 2) - .02;
  const mat = (c, x = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .55, ...x });
  const glow = (c, i = 2) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, roughness: .4 });
  const mesh = (geo, m, cast = true) => { const x = new THREE.Mesh(geo, m); x.castShadow = cast; x.receiveShadow = true; return x; };
  const hAt = (x, z) => {
    const r = Math.hypot(x, z) / GROUND_R, edge = 1 - Math.pow(Math.min(r, 1), 4);
    return .16 * (1 - r * r) + edge * (.025 * Math.sin(x * 6 + 1) * Math.cos(z * 5) + .018 * Math.sin((x + z) * 9));
  };
  const groundY = (x, z) => GY + hAt(x, z);
  const place = (obj, x, z, ry = 0) => { obj.position.set(x, groundY(x, z), z); obj.rotation.y = ry; globe.add(obj); return obj; };

  if (o.base) {
    const pts = [[0, 0], [1.62, 0], [1.66, .04], [1.66, .12], [1.6, .16], [1.52, .2], [1.5, .46], [1.42, .52], [1.36, .58], [1.3, BASE_H], [0, BASE_H]].map(([x, y]) => new THREE.Vector2(x, y));
    const base = mesh(new THREE.LatheGeometry(pts, 96), new THREE.MeshPhysicalMaterial({ color: 0x5a3220, roughness: .38, clearcoat: .8, clearcoatRoughness: .25 }));
    globe.add(base);
    const gold = new THREE.MeshStandardMaterial({ color: 0xd9a74e, metalness: 1, roughness: .22 });
    for (const [y, r, t] of [[.17, 1.56, .028], [.5, 1.47, .025]]) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r, t, 12, 120), gold); ring.rotation.x = Math.PI / 2; ring.position.y = y; globe.add(ring);
    }
  }
  const glass = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 72), new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: .02, transmission: 1, thickness: .35, ior: 1.33, clearcoat: .7, clearcoatRoughness: .16,
    specularIntensity: .3, envMapIntensity: .9, attenuationColor: new THREE.Color(0xe8f3ff), attenuationDistance: 6,
  }));
  glass.material.depthWrite = false; glass.position.y = CY; globe.add(glass);

  { // 雪地
    const rings = 24, segs = 110, pos = [], idx = [];
    pos.push(0, hAt(0, 0), 0);
    for (let i = 1; i <= rings; i++) for (let j = 0; j < segs; j++) {
      const r = GROUND_R * i / rings, a = j / segs * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r; pos.push(x, hAt(x, z), z);
    }
    for (let j = 0; j < segs; j++) idx.push(0, 1 + (j + 1) % segs, 1 + j);
    for (let i = 1; i < rings; i++) { const a0 = 1 + (i - 1) * segs, a1 = 1 + i * segs;
      for (let j = 0; j < segs; j++) { const j1 = (j + 1) % segs; idx.push(a0 + j, a0 + j1, a1 + j, a0 + j1, a1 + j1, a1 + j); } }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
    const snow = mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xf3f7ff, roughness: .85, sheen: 1, sheenColor: new THREE.Color(0xcfe0ff) }), false);
    snow.position.y = GY; globe.add(snow);
    const skirt = new THREE.Mesh(new THREE.CylinderGeometry(GROUND_R, GROUND_R * .9, Math.max(GY - BASE_H, .05) + .02, 80, 1, true), mat(0xe9eef8, { roughness: .9 }));
    skirt.position.y = (GY + BASE_H) / 2; globe.add(skirt);
  }
  { // 小屋
    const h = new THREE.Group(), wood = mat(0x8a3a2c, { roughness: .7 }), snowM = mat(0xf6f9ff, { roughness: .9 });
    const body = mesh(new THREE.BoxGeometry(.42, .3, .36), wood); body.position.y = .15; h.add(body);
    for (const s of [-1, 1]) {
      const roof = mesh(new THREE.BoxGeometry(.5, .035, .29), snowM); roof.position.set(0, .37, s * .1); roof.rotation.x = s * .62; h.add(roof);
      const under = mesh(new THREE.BoxGeometry(.48, .02, .27), mat(0x4a2418)); under.position.set(0, .35, s * .095); under.rotation.x = s * .62; h.add(under);
    }
    const gable = new THREE.Shape(); gable.moveTo(-.21, 0); gable.lineTo(.21, 0); gable.lineTo(0, .13); gable.closePath();
    for (const s of [-1, 1]) { const g = mesh(new THREE.ExtrudeGeometry(gable, { depth: .01, bevelEnabled: false }), wood); g.rotation.y = s * Math.PI / 2; g.position.set(s * .21, .3, 0); h.add(g); }
    const chim = mesh(new THREE.BoxGeometry(.06, .14, .06), mat(0x6b6f7a)); chim.position.set(.11, .43, -.06); h.add(chim);
    const door = mesh(new THREE.BoxGeometry(.08, .14, .01), mat(0x4a2418)); door.position.set(0, .07, .182); h.add(door);
    const win = glow(0xffc46b, 1.5);
    for (const x of [-.13, .13]) { const w = mesh(new THREE.BoxGeometry(.075, .07, .01), win, false); w.position.set(x, .17, .182); h.add(w); }
    const pl = new THREE.PointLight(0xffb15c, .55, .9, 2); pl.position.set(0, .18, .32); h.add(pl);
    place(h, 0, -.05);
  }
  const twinkles = [];
  const tree = (x, z, s, lights) => {
    const t = new THREE.Group(), green = mat(0x1f5a3c, { roughness: .8 }), white = mat(0xf6f9ff, { roughness: .9 });
    const trunk = mesh(new THREE.CylinderGeometry(.025, .03, .08, 10), mat(0x5b3a26)); trunk.position.y = .04; t.add(trunk);
    [[.15, .2, .14], [.12, .18, .26], [.085, .15, .36]].forEach(([r, h, y]) => {
      const c = mesh(new THREE.ConeGeometry(r, h, 16), green); c.position.y = y; t.add(c);
      const cap = mesh(new THREE.ConeGeometry(r * .62, h * .38, 16), white); cap.position.y = y + h * .33; t.add(cap);
    });
    if (lights) {
      const star = mesh(new THREE.OctahedronGeometry(.032), glow(0xffd36b, 4), false); star.position.y = .47; t.add(star);
      twinkles.push({ m: star.material, base: 4, sp: 2.2, ph: 0 });
      const cols = [0xff5a5a, 0xffd36b, 0x6bc8ff, 0x7dff9a, 0xff8de1];

      <li>需要網路下載 3D 引擎（第一次約 0.7 MB，之後有快取）；沒網路時不顯示雪球，記帳照常。</li>
    </ul></div>
    <div class="loadingNote">雪球拖曳可轉動；狐狸模型載入需要幾秒。</div></div>`;
  const g = makeGlobe(document.getElementById('g'), v.globe);
  globes.push(g);
  const cv = document.getElementById('g');
  cv.addEventListener('dblclick', () => g.shake());
  screen.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    g.shake(); globes[1]?.shake();
    toast(b.classList.contains('p') ? '已記一筆豪支出（示意）' : '已記一筆岑支出（示意）');
  });

  if (id === 'C') {
    const sheet = document.getElementById('sheet');
    const open = () => { sheet.classList.add('show'); if (!globes[1]) { globes[1] = makeGlobe(document.getElementById('g2'), { fit: 1.05, orbit: true, flakes: 1200 }); } globes[1].setActive(true); g.setActive(false); };
    const close = () => { sheet.classList.remove('show'); globes[1]?.setActive(false); g.setActive(true); };
    document.getElementById('fab').onclick = open;
    document.getElementById('close').onclick = close; document.getElementById('close2').onclick = close;
    document.getElementById('shake2').onclick = () => globes[1]?.shake();
  }
  if (id === 'D') {
    const drag = document.getElementById('drag'), sc = document.getElementById('dscroll'), pull = document.getElementById('pull'), msg = document.getElementById('pullMsg');
    const MAX = 280, TRIG = 150;
    let startY = null, dy = 0;
    g.setActive(false);
    const set = v => { dy = v; drag.style.transform = `translateY(${v}px)`; pull.style.height = v + 'px'; msg.textContent = v > TRIG ? '放開：搖一搖＋同步' : '往下拉'; };
    const down = y => { if (sc.scrollTop > 0) return; startY = y; drag.classList.add('dragging'); g.setActive(true); };
    const move = (y, e) => { if (startY == null) return; const d = Math.max(0, y - startY); if (d > 0 && e.cancelable) e.preventDefault(); set(Math.min(MAX, d * .6)); };
    const up = () => {
      if (startY == null) return; startY = null; drag.classList.remove('dragging');
      if (dy > TRIG) {
        set(260); g.shake(); msg.textContent = '同步中…';
        setTimeout(() => { toast('☁️ 同步完成'); set(0); setTimeout(() => g.setActive(false), 400); }, 1500);
      } else { set(0); setTimeout(() => g.setActive(false), 400); }
    };
    drag.addEventListener('mousedown', e => down(e.clientY));
    addEventListener('mousemove', e => move(e.clientY, e));
    addEventListener('mouseup', up);
    drag.addEventListener('touchstart', e => down(e.touches[0].clientY), { passive: true });
    drag.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
    drag.addEventListener('touchend', up);
    window.demoPull = () => { set(260); g.setActive(true); };
  }
}
const tabs = document.getElementById('tabs');
tabs.innerHTML = variants.map(v => `<button class="tab" data-id="${v.id}">${v.id}. ${v.name}${v.tag ? `<small>（${v.tag}）</small>` : ''}</button>`).join('');
tabs.onclick = e => { const b = e.target.closest('.tab'); if (b) show(b.dataset.id); };
show(new URLSearchParams(location.search).get('v') || 'A');
window.showVariant = show;
</script>
</body>
